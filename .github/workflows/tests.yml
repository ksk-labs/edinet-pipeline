name: tests

# プルリクエストと main への push で、リポジトリのテストを実行する。
# これまで tests/ を回す CI が無く、テストの証跡がローカル実行のみだった
# ため追加した（2026-11-17、塊1 修正の PR #30 の着地に伴う整備）。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
