name: daily_acquire

# S2-T5 §1 日次取得 (pipeline.discovery)。EDINET API で対象日の書類一覧と
# 書類の原形 (zip・PDF・添付・英語) を取得し、書類目録と raw を v2
# データセットへ保存する。CSV (type=5) は取得しない。
# - schedule: 1日2回 (03:30 JST と 15:30 JST)。いずれも対象は前日
#   (Asia/Tokyo) で、2回目は1回目の失敗・滞留への同日回復である
#   (冪等なため取得済みは飛ばされる)。時刻の根拠は S2-T5-4 の作業記録。
# - workflow_dispatch: 日付を指定して手動実行する。date が空なら前日
#   (Asia/Tokyo) が対象になる。
# - 取得状態は v2 の取得目録 (acquisition/month=YYYY-MM/ledger.jsonl) で
#   管理され、再実行しても取得済みの原形は再取得しない (冪等)。

on:
  schedule:
    - cron: "30 18 * * *"  # 毎日 03:30 JST
    - cron: "30 6 * * *"  # 毎日 15:30 JST
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 (YYYY-MM-DD、空なら前日 JST)"
        required: false
        type: string
        default: ""
      max_docs:
        description: "今回の実行で試行する書類数の上限 (空なら無制限。動作確認用)"
        required: false
        type: string
        default: ""
      kinds:
        description: "対象の種別 (カンマ区切り、空なら zip,pdf,attach,english)"
        required: false
        type: string
        default: ""

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run acquisition
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATE: ${{ inputs.date }}
          MAX_DOCS: ${{ inputs.max_docs }}
          KINDS: ${{ inputs.kinds }}
        run: |
          set -euo pipefail
          args=(--work-dir work/discovery)
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ -n "$MAX_DOCS" ]; then args+=(--max-docs "$MAX_DOCS"); fi
          if [ -n "$KINDS" ]; then args+=(--kinds "$KINDS"); fi
          python -m pipeline.discovery run "${args[@]}"
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ inputs.date }}
          path: |
            work/discovery/state/*.jsonl
            work/discovery/out/run_summary.json
          if-no-files-found: warn
