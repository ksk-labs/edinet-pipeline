name: gold

# Gold 生成 (P2-T5、pipeline.gold) の運用ワークフロー。v2 データセットの
# gold/ 配下への配置と日次差分更新を行う。
# - build: 第1期 Silver (提出日 2021-11-01 以降) から全量を生成する。
# - update: Silver の月の透かしと比較して変化した月を検出し、
#   影響会社の行だけを再生成して差し替える (Silver 日次→Gold 日次の順序)。
# - sync-registry: 指標登録簿の正本 (edinet-definitions) の内容を
#   v2 データセット上の写し (definitions/indicators.yaml) へ同期する。
#   ローカルの HF トークン (muse-ksk) には v2 への書き込み権限がなく
#   ローカルでは実行できないため、Actions 経由が唯一の経路である。
#   登録簿の内容は dispatch 時の registry_yaml 入力で渡す。
# - since_month: build / update の対象開始月 (YYYY-MM)。空なら
#   build は pipeline.gold の既定値 2021-11 (第1期) を使い、update は
#   既存の state.json が保持する最古の月を引き継ぐ (state の範囲より
#   狭い指定は gold.py 側でエラーになる。Issue #55)。全期間の再生成は
#   2016-03 を指定する (第2期 Silver を含む全129か月が対象になる)。
# 日次の定期実行 (Issue #50): 主経路は daily_parse の後段ジョブ
# (gold-update) で、Silver へ反映された差分へ同じ run の中で追随
# する。本ワークフローの schedule は、daily_parse の run 自体が
# 起動しなかった日の回収を担う予備経路で、毎日 20:30 JST に
# update を全期間 (since_month=2016-03) で実行する。update は
# 透かしによる差分検出で冪等であり、主経路と重なっても二重には
# 適用されない。手動 dispatch・schedule・後段ジョブの競合は、
# concurrency グループ gold-write (リポジトリ全体で有効) を
# 共有し、cancel-in-progress: false と queue: max で直列化して防ぐ。
# 必要な秘密は HF_TOKEN のみ (入力の読み取りは公開データセットと
# v2 上の登録簿の写しのため不要)。

on:
  schedule:
    - cron: "30 11 * * *"  # 毎日 20:30 JST (Issue #50 の予備経路)
  workflow_dispatch:
    inputs:
      command:
        description: "実行するコマンド"
        required: true
        type: choice
        options:
          - build
          - update
          - sync-registry
      registry_yaml:
        description: "sync-registry の場合に同期する指標登録簿 (indicators.yaml) の全文"
        required: false
        type: string
      since_month:
        description: "build / update の対象開始月 YYYY-MM（空なら build は既定値 2021-11、update は state の範囲を引き継ぐ）"
        required: false
        default: ''
        type: string

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: gold-write
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run gold command
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COMMAND: ${{ inputs.command }}
          REGISTRY_YAML: ${{ inputs.registry_yaml }}
          SINCE_MONTH: ${{ inputs.since_month }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            COMMAND=update
            SINCE_MONTH=2016-03
          fi
          mkdir -p work/gold
          if [ "$COMMAND" = "sync-registry" ]; then
            if [ -z "$REGISTRY_YAML" ]; then
              echo "registry_yaml input is required for sync-registry" >&2
              exit 1
            fi
            python -c "import os, yaml; open('work/gold/registry.yaml', 'w', encoding='utf-8').write(os.environ['REGISTRY_YAML']); data = yaml.safe_load(open('work/gold/registry.yaml', encoding='utf-8')); assert isinstance(data, dict) and data.get('version') is not None, 'registry_yaml is empty or not a valid indicators.yaml'"
            python -m pipeline.gold sync-registry \
              --work-dir work/gold --upload \
              --registry-file work/gold/registry.yaml \
              | tee work/gold/result.json
          else
            ARGS=()
            if [ -n "$SINCE_MONTH" ]; then
              if ! [[ "$SINCE_MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
                echo "since_month must be in YYYY-MM format: $SINCE_MONTH" >&2
                exit 1
              fi
              ARGS+=(--since-month "$SINCE_MONTH")
            fi
            python -m pipeline.gold "$COMMAND" \
              --work-dir work/gold --upload "${ARGS[@]}" \
              | tee work/gold/result.json
          fi
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-result
          path: work/gold/result.json
          if-no-files-found: ignore
